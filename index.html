<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Mã Dự Thưởng</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .lookup-container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #007bff;
        }
        button {
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #loading {
            display: none;
            text-align: center;
            color: #666;
            margin-bottom: 15px;
        }
        #result-box {
            display: none;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        #result-box p {
            margin: 8px 0;
            color: #444;
        }
        #res-codes {
            background: #fff;
            padding: 12px;
            border: 1px dashed #007bff;
            border-radius: 4px;
            font-weight: bold;
            color: #007bff;
            word-break: break-all;
            margin-top: 5px;
        }
        #error-box {
            display: none;
            color: #d9534f;
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="lookup-container">
    <h2>Tra Cứu Mã Dự Thưởng</h2>
    <div class="form-group">
        <input type="text" id="search-phone" placeholder="Nhập số điện thoại của bạn..." onkeypress="handleKeyPress(event)" />
        <button onclick="lookupCodes()">Tra cứu</button>
    </div>
    
    <div id="loading">Đang tìm kiếm thông tin...</div>
    
    <div id="result-box">
        <p><strong>Họ tên:</strong> <span id="res-name"></span></p>
        <p><strong>Số điện thoại:</strong> <span id="res-phone"></span></p>
        <p><strong>Danh sách mã dự thưởng:</strong></p>
        <div id="res-codes"></div>
    </div>
    
    <div id="error-box">
        Không tìm thấy thông tin phù hợp với số điện thoại này!
    </div>
</div>

<script>
function handleKeyPress(e) {
    if (e.key === 'Enter') {
        lookupCodes();
    }
}

function lookupCodes() {
    var phone = document.getElementById('search-phone').value.trim();
    var loading = document.getElementById('loading');
    var resultBox = document.getElementById('result-box');
    var errorBox = document.getElementById('error-box');
    
    if (!phone) {
        alert('Vui lòng nhập số điện thoại!');
        return;
    }
    
    resultBox.style.display = 'none';
    errorBox.style.display = 'none';
    loading.style.display = 'block';
    
    // Thay URL_WEB_APP_CUA_BAN bằng link Google Apps Script đã deploy
    var webAppUrl = 'https://script.google.com/macros/s/AKfycbzICXTGPV81OPstzh58RSbFQ83DRDMHxfPrpImjEfOiKSvtgmBF-i2yjn8-bzSRIpk7/exec' + encodeURIComponent(phone);
    
    fetch(webAppUrl)
        .then(response => response.json())
        .then(data => {
            loading.style.display = 'none';
            if (data.status === 'success') {
                document.getElementById('res-name').innerText = data.name;
                document.getElementById('res-phone').innerText = data.phone;
                document.getElementById('res-codes').innerText = data.codes;
                resultBox.style.display = 'block';
            } else {
                errorBox.style.display = 'block';
            }
        })
        .catch(error => {
            loading.style.display = 'none';
            alert('Đã xảy ra lỗi kết nối, vui lòng thử lại sau.');
            console.error('Error:', error);
        });
}
</script>

</body>
</html>
