<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.Music - Lucky Code Lookup</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Roboto', sans-serif;
            background-color: transparent;
        }

        .bg-container {
            position: relative;
            width: 100%;
            margin: 0 auto;
        }

        .bg-container img.poster-bg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Canh chỉnh vị trí form vừa khít vào ô trắng trên poster */
        .lookup-overlay {
            position: absolute;
            top: 58%; 
            left: 17%;
            width: 66%;
            padding: 5px;
        }

        .form-group {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border: 2px solid #007bff;
            border-radius: 4px;
            font-size: 15px;
            outline: none;
            background: #ffffff;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.05);
        }

        button {
            padding: 10px 18px;
            background-color: #007bff;
            color: white;
            border: 2px solid #0056b3;
            border-radius: 4px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        button:hover {
            background-color: #0056b3;
        }

        #loading {
            display: none;
            text-align: center;
            color: #333;
            font-size: 13px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        #result-box {
            display: none;
            background: rgba(255, 255, 255, 0.98);
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #007bff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #result-box p {
            margin: 4px 0;
            color: #333;
            font-size: 13px;
        }

        #res-codes {
            background: #f8f9fa;
            padding: 6px 8px;
            border: 1px dashed #007bff;
            border-radius: 4px;
            font-weight: bold;
            color: #007bff;
            word-break: break-all;
            margin-top: 4px;
            line-height: 1.4;
            max-height: 90px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
        }

        #error-box {
            display: none;
            color: #d9534f;
            text-align: center;
            margin-top: 6px;
            font-weight: bold;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.95);
            padding: 6px;
            border-radius: 4px;
        }

        /* Responsive cho Mobile */
        @media (max-width: 768px) {
            .lookup-overlay {
                top: 57.5%;
                left: 14.5%;
                width: 71%;
            }
            input[type="text"] {
                font-size: 12px;
                padding: 6px 8px;
            }
            button {
                font-size: 12px;
                padding: 6px 10px;
            }
            #result-box p, #res-codes {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

<div class="bg-container">
    <img src="Level-Up.jpg" alt="G.Music Level Up Background" class="poster-bg">
    
    <div class="lookup-overlay">
        <div class="form-group">
            <input type="text" id="search-phone" placeholder="Nhập số điện thoại của bạn..." onkeypress="handleKeyPress(event)" />
            <button onclick="lookupCodes()">Tra cứu</button>
        </div>
        
        <div id="loading">Đang tìm kiếm thông tin...</div>
        
        <div id="result-box">
            <p><strong>Họ tên:</strong> <span id="res-name"></span></p>
            <p><strong>SĐT:</strong> <span id="res-phone"></span></p>
            <p><strong>Mã dự thưởng:</strong></p>
            <div id="res-codes"></div>
        </div>
        
        <div id="error-box">
            Không tìm thấy thông tin phù hợp với số điện thoại này!
        </div>
    </div>
</div>

<script>
function handleKeyPress(e) {
    if (e.key === 'Enter') {
        lookupCodes();
    }
}

function lookupCodes() {
    var phone = document.getElementById('search-phone').value.trim();
    var loading = document.getElementById('loading');
    var resultBox = document.getElementById('result-box');
    var errorBox = document.getElementById('error-box');
    
    if (!phone) {
        alert('Vui lòng nhập số điện thoại!');
        return;
    }
    
    resultBox.style.display = 'none';
    errorBox.style.display = 'none';
    loading.style.display = 'block';
    
    var webAppUrl = 'https://script.google.com/macros/s/AKfycbzICXTGPV81OPstzh58RSbFQ83DRDMHxfPrpImjEfOiKSvtgmBF-i2yjn8-bzSRIpk7/exec?phone=' + encodeURIComponent(phone);
    
    fetch(webAppUrl, { redirect: 'follow' })
        .then(response => response.json())
        .then(data => {
            loading.style.display = 'none';
            if (data.status === 'success') {
                document.getElementById('res-name').innerText = data.name;
                document.getElementById('res-phone').innerText = data.phone;
                
                if (data.codes) {
                    var codesArray = String(data.codes).split(',').map(item => item.trim()).filter(item => item.length > 0);
                    document.getElementById('res-codes').innerHTML = codesArray.join('<br>');
                } else {
                    document.getElementById('res-codes').innerText = 'Không có mã';
                }
                
                resultBox.style.display = 'block';
            } else {
                errorBox.style.display = 'block';
            }
        })
        .catch(error => {
            loading.style.display = 'none';
            alert('Đã xảy ra lỗi kết nối, vui lòng thử lại sau.');
            console.error('Error:', error);
        });
}
</script>

</body>
</html>
